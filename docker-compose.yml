# ============================================================
# docker-compose.yml - TAI FastAPI Gateway + Custom SAP API
#
# This runs TWO services:
#   1. fastapi-gateway  → Our new FastAPI (port 8001)
#   2. custom-api       → Existing Flask SAP API (port 5000)
#
# The FastAPI gateway calls the custom-api internally
# ============================================================
version: "3.9"

services:

  # ──────────────────────────────────────────────────────────
  #  SERVICE 1: New FastAPI Gateway (AI Team facing)
  # ──────────────────────────────────────────────────────────
  fastapi-gateway:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    container_name: tai-fastapi-gateway
    ports:
      - "8001:8001"
    environment:
      # Database
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      # Security
      - FASTAPI_API_KEY=${FASTAPI_API_KEY:-tai-secret-key-2024}
      - FASTAPI_ALLOWED_IPS=${FASTAPI_ALLOWED_IPS:-127.0.0.1,::1}
      # SAP Custom API URL (internal docker network)
      - SAP_BASE_URL=http://custom-api:5001
      # Environment
      - NODE_ENV=${NODE_ENV:-development}
    depends_on:
      - custom-api
    networks:
      - tai-network
    restart: unless-stopped
    volumes:
      - ./fastapi:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ──────────────────────────────────────────────────────────
  #  SERVICE 1A: FastAPI Scheduler (Auto-pull background job)
  # ──────────────────────────────────────────────────────────
  fastapi-scheduler:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    container_name: tai-fastapi-scheduler
    command: python scheduler.py
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - SAP_HOST=${SAP_HOST}
      - SAP_PORT=${SAP_PORT}
      - SAP_PROTOCOL=${SAP_PROTOCOL}
      - SAP_USER=${SAP_USER}
      - SAP_PASSWORD=${SAP_PASSWORD}
      - SAP_CLIENT=${SAP_CLIENT}
      - ALERT_FROM_EMAIL=${ALERT_FROM_EMAIL}
      - ALERT_EMAIL_PASSWORD=${ALERT_EMAIL_PASSWORD}
      - ALERT_SMTP_HOST=${ALERT_SMTP_HOST}
      - ALERT_SMTP_PORT=${ALERT_SMTP_PORT}
      - ALERT_TO_EMAILS=${ALERT_TO_EMAILS}
    networks:
      - tai-network
    restart: unless-stopped
    volumes:
      - ./fastapi:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ──────────────────────────────────────────────────────────
  #  SERVICE 1B: FastAPI Push Worker (Auto-push background job)
  # ──────────────────────────────────────────────────────────
  fastapi-push-worker:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    container_name: tai-fastapi-push-worker
    # Run a simple loop to check the queue every 60 seconds
    command: sh -c "while true; do python push.py; sleep 60; done"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - SAP_HOST=${SAP_HOST}
      - SAP_PORT=${SAP_PORT}
      - SAP_PROTOCOL=${SAP_PROTOCOL}
      - SAP_USER=${SAP_USER}
      - SAP_PASSWORD=${SAP_PASSWORD}
      - SAP_CLIENT=${SAP_CLIENT}
    networks:
      - tai-network
    restart: unless-stopped
    volumes:
      - ./fastapi:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ──────────────────────────────────────────────────────────
  #  SERVICE 2: Existing Custom SAP API (Flask)
  # ──────────────────────────────────────────────────────────
  custom-api:
    build:
      context: ./custom_api
      dockerfile: Dockerfile
    container_name: tai-custom-api
    ports:
      - "5001:5001"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - NODE_ENV=${NODE_ENV:-development}
    networks:
      - tai-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ──────────────────────────────────────────────────────────
  #  SERVICE 3: FastAPI Frontend Dashboard (port 8080)
  # ──────────────────────────────────────────────────────────
  fastapi-frontend:
    image: python:3.11-slim
    container_name: tai-fastapi-frontend
    ports:
      - "8080:8080"
    volumes:
      - ./fastapi_frontend:/app
    working_dir: /app
    command: python -m http.server 8080
    networks:
      - tai-network
    restart: unless-stopped

# ──────────────────────────────────────────────────────────
#  Shared Network
# ──────────────────────────────────────────────────────────
networks:
  tai-network:
    driver: bridge
